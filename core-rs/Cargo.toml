[package]
name = "downloadcore"
version = "0.1.0"
edition = "2024"
description = "HTTP/HTTPS 多线程下载核心（Rust 版）"

[lib]
name = "downloadcore"
# staticlib 供 C ABI 被宿主编译期吸收；rlib 供 Rust 侧测试
crate-type = ["staticlib", "rlib"]

[features]
# 默认打包"自研网络层"（正式版）：小、依赖少
default = ["backend-native"]
backend-native = []
# 可选打包"大框架网络层"（LTS 版）：稳、全，但体积大
backend-lts = ["dep:reqwest", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 自研网络层用系统 TLS（Windows 走 Schannel），无需 C 编译器
native-tls = "0.2"
# 仅 LTS 后端需要（大依赖，默认不编）
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"], optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"], optional = true }

# 体积优化：给"被宿主编译期吸收"的 staticlib 减重
[profile.release]
opt-level = "z"      # 优化目标偏向体积
lto = true           # 全局 LTO，消除重复的泛型代码
codegen-units = 1    # 单编译单元，配合 LTO 体积更小
strip = true         # 全量去除符号（保留导出接口所需）
