[package]
name = "downloadcore"
version = "0.1.0"
edition = "2024"
description = "HTTP/HTTPS 多线程下载核心（Rust 版）"

[lib]
name = "downloadcore"
# staticlib 供 C ABI 被宿主编译期吸收；rlib 供 Rust 侧测试
crate-type = ["staticlib", "rlib"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }

# 体积优化：给"被宿主编译期吸收"的 staticlib 减重
[profile.release]
opt-level = "z"      # 优化目标偏向体积
lto = true           # 全局 LTO，消除重复的泛型代码
codegen-units = 1    # 单编译单元，配合 LTO 体积更小
strip = true        # 全量去除符号（保留导出接口所需）
