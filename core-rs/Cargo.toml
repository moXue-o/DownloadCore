[package]
name = "downloadcore"
version = "0.1.0"
edition = "2024"
description = "HTTP/HTTPS 多线程下载核心（Rust 版）"

[lib]
name = "downloadcore"
# staticlib 供 C ABI 被宿主编译期吸收；rlib 供 Rust 侧测试
crate-type = ["staticlib", "rlib"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }
